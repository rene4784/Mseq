                }
                
                View.setTrackDraggingState(idx, true);
            },

            handleTrackDragMove(e) {
                if(!State.isTrackDragging) return;
                const clientY = e.clientY;
                const clientX = e.clientX;
                UI.updateDragAvatar(clientX, clientY);
                
                // Show drop indicator
                const ovr = document.getElementById('overviewContainer');
                const rect = ovr.getBoundingClientRect();
                const relativeY = clientY - rect.top + ovr.scrollTop;
                const contentY = relativeY - 24; 
                let targetIdx = Math.round(contentY / 40);
                targetIdx = Math.max(0, Math.min(State.tracks.length, targetIdx));
                
                // Position line
                const lineY = 24 + (targetIdx * 40);
                View.showDropIndicator(lineY);
            },

            handleTrackDragEnd(e) {
                if(!State.isTrackDragging) return;
                
                UI.removeDragAvatar();
                View.hideDropIndicator();
                View.setTrackDraggingState(State.dragTrackIdx, false); // Restore style

                // Calculate drop target
                const ovr = document.getElementById('overviewContainer');
                const rect = ovr.getBoundingClientRect();
                const relativeY = e.clientY - rect.top + ovr.scrollTop;
                // Subtract padding
                const contentY = relativeY - 24; 
                
                // Determine insertion index (0 to tracks.length)
                // Using round gives nearest boundary
                let targetIdx = Math.round(contentY / 40);
                targetIdx = Math.max(0, Math.min(State.tracks.length, targetIdx));
                
                const currentIdx = State.dragTrackIdx;
                
                // If dropped at same position or adjacent (no change)
                if (targetIdx !== currentIdx && targetIdx !== currentIdx + 1) {
                    // Adjust index because removing item shifts indices
                    let insertAt = targetIdx;
                    if (targetIdx > currentIdx) insertAt -= 1;
                    State.reorderTrack(currentIdx, insertAt);
                } else {
                    View.refresh(); // Just restore look
                }
                
                // Delay clearing the flag so click handler knows we were dragging
                setTimeout(() => {
                    State.isTrackDragging = false;
                    State.dragTrackIdx = -1;
                    View.refresh(); // Ensure UI is fully synced
                }, 0);
            },
            
            touchToMouse(e) {
                const t = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
                return {
                    clientX: t.clientX, clientY: t.clientY,
                    target: e.target, button: (e.touches && e.touches.length > 1) ? 0 : (e.button || 0),
                    preventDefault: () => e.preventDefault && e.preventDefault()
                };
            },
            
            getGridPos(e) {
                const rect = document.getElementById('musicCanvas').getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                let col = Math.floor((x - Config.KEY_WIDTH) / Config.GRID_W) + State.viewportStartCol;
                if (x < Config.KEY_WIDTH) col = -1; 
                const row = Math.floor(y / Config.GRID_H);
                return { col, row, y: row * Config.GRID_H };
            },

            handleCanvasDown(e) {
                if (State.isTwoFingerScroll) return;

                if (e.button === 1 || (e.button === 0 && e.shiftKey)) {
                    State.interactionMode = 'PAN';
                    State.dragStartPos = { x: e.clientX, y: e.clientY };
                    State.dragStartViewport = State.viewportStartCol;
                    return;
                }

                const pos = this.getGridPos(e);
                const track = State.getCurrentTrack();
                if (pos.col < 0) return; 

                if (e.button === 2) {
                    const noteIdx = track.notes.findIndex(n => n.y === pos.y && pos.col >= n.x && pos.col < n.x + n.length);
                    if (noteIdx !== -1) {
                        track.notes.splice(noteIdx, 1);
                        History.push();
                        View.refresh();
                    }
                    return;
                }

                State.interactionMode = 'DRAW';
                State.dragStartPos = { x: pos.col, y: pos.row };
                State.isNoteMoved = false;
                State.noteInteractionStart = { x: e.clientX, y: e.clientY };

                const clickedNote = track.notes.find(n => n.y === pos.y && pos.col >= n.x && pos.col < n.x + n.length);

                if (clickedNote) {
                    State.selectedNote = clickedNote;
                    State.dragStartNoteState = { ...clickedNote };
                    if (pos.col === clickedNote.x + clickedNote.length - 1) {
                        State.interactionMode = 'RESIZE';
                        State.lastPreviewLength = clickedNote.length; // Init preview state
                    } else {
                        State.interactionMode = 'MOVE';
                        State.lastPreviewRow = Math.floor(clickedNote.y / Config.GRID_H); // Init preview state
                    }
                } else {
                    State.selectedNote = null;
                    const prevNotes = track.notes.filter(n => n.x <= pos.col);
                    prevNotes.sort((a, b) => b.x - a.x);
                    const newOctave = prevNotes[0] ? prevNotes[0].octave : 4;
                    State.tempNote = { x: pos.col, y: pos.y, length: 1, octave: newOctave };
                    
                    // Preview Sound on Draw Start
                    const row = Math.floor(pos.y / Config.GRID_H);
                    State.lastPreviewRow = row;
                    Audio.previewNote(row);
                }
                View.refresh();
            },

            // Common Logic for jumping to a position in Overview
            handleOverviewJump(x, y) {
                const container = document.getElementById('overviewContainer');
                
                // Track selection logic
                const clickedTrackY = y - 24; 
                const trackIdx = Math.floor(clickedTrackY / 40);
                if (trackIdx >= 0 && trackIdx < State.tracks.length) {
                    // Use lightweight update
                    View.selectTrack(trackIdx);
                }

                // Viewport jump logic
                const fullW = Math.max(container.clientWidth - Config.LABEL_WIDTH - Config.ACTION_WIDTH, 100);
                const pxPerStep = fullW / Config.TOTAL_COLS;
                const visibleCols = Math.ceil((View.canvas.width - Config.KEY_WIDTH) / Config.GRID_W);
                
                const clickCol = (x - Config.LABEL_WIDTH) / pxPerStep;
                let newViewport = Math.floor(clickCol - (visibleCols / 2));
                
                // Clamp
                newViewport = Math.max(0, Math.min(Config.TOTAL_COLS - visibleCols, newViewport));
                State.viewportStartCol = newViewport;
                
                // IMPORTANT: Use lighter update method
                View.render();
                View.updateOverviewViewport();
            },
            
            // Logic for dragging the indicator
            handleOverviewDrag(clientX) {
                const container = document.getElementById('overviewContainer');
                const fullW = Math.max(container.clientWidth - Config.LABEL_WIDTH - Config.ACTION_WIDTH, 100);
                const rect = container.getBoundingClientRect();
                const x = clientX - rect.left;
                
                const newLeft = x - Config.LABEL_WIDTH - State.dragStartOffset;
                const ratio = newLeft / fullW;
                
                const visibleCols = Math.ceil((View.canvas.width - Config.KEY_WIDTH) / Config.GRID_W);
                State.viewportStartCol = Math.max(0, Math.min(Config.TOTAL_COLS - visibleCols, Math.floor(ratio * Config.TOTAL_COLS)));
                
                // IMPORTANT: Use lighter update method
                View.render();
                View.updateOverviewViewport();
            },

            handleBarDown(e) {
                State.isDraggingSeek = true;
                this.updateSeek(e);
            },

            updateSeek(e) {
                const bar = document.getElementById('playbackBarArea');
                const rect = bar.getBoundingClientRect();
                // Since the bar is absolute positioned with left margin, rect.left gives the actual screen coordinate where it starts
                let x = e.clientX - rect.left; 
                
                // Map to 0 - width
                const fullW = rect.width;
                x = Math.max(0, Math.min(x, fullW));
                
                const pct = x / fullW;
                const step = Math.floor(pct * Config.TOTAL_COLS);
                State.playbackPosition = step;
                if (State.isPlaying) Audio.play(step);
                else {
                    View.updatePlaybackIndicators();
                    View.updateTimeDisplay();
                }
            },

            handleGlobalMove(e) {
                if (State.isResizingTimeline) {
                    const deltaY = e.clientY - State.dragStartPos.y;
                    const currentH = document.getElementById('timelineArea').offsetHeight;
                    let newH = currentH - deltaY;
                    newH = Math.max(24, Math.min(newH, window.innerHeight * 0.8));
                    document.getElementById('timelineArea').style.height = `${newH}px`;
                    State.dragStartPos.y = e.clientY; 
                    return;
                }
                if (State.isDraggingSeek) { this.updateSeek(e); return; }
                
                // Overview Drag (Mouse & Touch)
                if (State.isDraggingViewportHandle) {
                    this.handleOverviewDrag(e.clientX);
                    return;
                }
                
                if (State.interactionMode === 'PAN') {
                    const dx = e.clientX - State.dragStartPos.x;
                    const colDiff = Math.round(dx / Config.GRID_W);
                    const visibleCols = Math.ceil((View.canvas.width - Config.KEY_WIDTH) / Config.GRID_W);
                    State.viewportStartCol = Math.max(0, Math.min(Config.TOTAL_COLS - visibleCols, State.dragStartViewport - colDiff));
                    View.refresh();
                    return;
                }
                
                if (State.interactionMode === 'NONE') return;
                
                const moveDist = Math.sqrt(Math.pow(e.clientX - State.noteInteractionStart.x, 2) + Math.pow(e.clientY - State.noteInteractionStart.y, 2));
                if (moveDist > 5) State.isNoteMoved = true;

                const pos = this.getGridPos(e);
                
                if (State.interactionMode === 'DRAW' && State.tempNote) {
                    const newLen = Math.max(1, pos.col - State.tempNote.x + 1);
                    // Do NOT update Y coordinate (keep pitch fixed during draw)
                    State.tempNote.length = newLen;
                    
                    // Preview on Length Change (Use fixed pitch)
                    if (State.lastPreviewLength !== newLen) {
                         const fixedRow = Math.floor(State.tempNote.y / Config.GRID_H);
                         Audio.previewNote(fixedRow); 
                         State.lastPreviewLength = newLen;
                    }
                }
                else if (State.interactionMode === 'MOVE' && State.selectedNote) {
                    const dx = pos.col - State.dragStartPos.x;
                    const dy = pos.row - State.dragStartPos.y;
                    State.selectedNote.x = Math.max(0, State.dragStartNoteState.x + dx);
                    const newY = (State.dragStartNoteState.y / Config.GRID_H + dy) * Config.GRID_H;
                    State.selectedNote.y = Math.max(0, Math.min(newY, (12 * Config.OCTAVES * Config.GRID_H) - Config.GRID_H));
                    const row = Math.floor(State.selectedNote.y / Config.GRID_H);
                    State.selectedNote.octave = (Config.OCTAVES - 1 - Math.floor(row/12)) + Config.BASE_OCTAVE;
                    
                    // Preview on Move (Pitch Change)
                    if (State.lastPreviewRow !== row) {
                        Audio.previewNote(row);
                        State.lastPreviewRow = row;
                    }
                }
                else if (State.interactionMode === 'RESIZE' && State.selectedNote) {
                    const dx = pos.col - State.dragStartPos.x;
                    const newLen = Math.max(1, State.dragStartNoteState.length + dx);
                    State.selectedNote.length = newLen;

                    // Preview on Resize (Length Change)
                    if (State.lastPreviewLength !== newLen) {
                        const row = Math.floor(State.selectedNote.y / Config.GRID_H);
                        Audio.previewNote(row);
                        State.lastPreviewLength = newLen;
                    }
                }
                View.render();
            },

            handleGlobalUp(e) {
                State.isDraggingSeek = false;
                State.isDraggingViewport = false;
                State.isDraggingViewportHandle = false;
                State.isResizingTimeline = false;
                State.isTwoFingerScroll = false;
                
                if (State.interactionMode === 'PAN') {
                    State.interactionMode = 'NONE';
                    return;
                }
                if (State.interactionMode === 'NONE') return;

                if (State.interactionMode === 'DRAW' && State.tempNote) {
                    State.getCurrentTrack().notes.push(State.tempNote);
                    State.selectedNote = State.tempNote;
                    State.tempNote = null;
                    Utils.removeOverlaps(State.selectedNote);
                    History.push();
                }
                else if (State.interactionMode === 'MOVE' || State.interactionMode === 'RESIZE') {
                    if (State.selectedNote) {
                        if (!State.isNoteMoved) UI.toggleSheet(true, 'sheet-note');
                        else { Utils.removeOverlaps(State.selectedNote); History.push(); }
                    }
                }
                State.interactionMode = 'NONE';
                View.refresh();
            },

            bindControls() {
                document.getElementById('musicCanvas').addEventListener('contextmenu', e => e.preventDefault());
                
                // Track Moving
                document.getElementById('sheetMoveTrackUpBtn').onclick = () => State.moveTrack(-1);
                document.getElementById('sheetMoveTrackDownBtn').onclick = () => State.moveTrack(1);

                const bindRange = (id, prop) => {
                    document.getElementById(id).addEventListener('input', e => {
                        State.getCurrentTrack().settings[prop] = parseInt(e.target.value);
                        View.updateSheetUI(); View.updateEnvelope();
                    });
                };
                ['Volume', 'Detune', 'Attack', 'Decay', 'Sustain', 'Release'].forEach(p => bindRange(`track${p}`, p.toLowerCase()));
                
                document.getElementById('trackWaveform').addEventListener('change', e => {
                    State.getCurrentTrack().settings.waveform = parseInt(e.target.value);
                });
                
                const updateNote = () => {
                    const n = State.selectedNote; if(!n) return;
                    const pInput = parseInt(document.getElementById('notePitch').value);
                    const oInput = parseInt(document.getElementById('noteOctave').value);
                    const octIndex = oInput - Config.BASE_OCTAVE;
                    const octaveRows = ((Config.OCTAVES - 1) - octIndex) * 12;
                    n.y = (octaveRows + (11 - pInput)) * Config.GRID_H;
                    n.octave = oInput;
                    n.length = parseInt(document.getElementById('noteLength').value);
                    Utils.removeOverlaps(n);
                    View.refresh(); History.push();
                };
                ['notePitch', 'noteOctave', 'noteLength'].forEach(id => document.getElementById(id).addEventListener('change', updateNote));

                document.getElementById('tempoInput').addEventListener('input', e => { document.getElementById('valBPM').textContent = e.target.value; });
                document.getElementById('masterVolume').addEventListener('input', e => {
                    const val = parseFloat(e.target.value);
                    document.getElementById('valMaster').textContent = Math.round(val * 100) + '%';
                    Audio.setMasterVolume(val);
                });
                
                document.getElementById('exportFlmmlBtn').onclick = Storage.exportMML;
                document.getElementById('saveBtn').onclick = Storage.saveJson;
                document.getElementById('loadBtn').onclick = () => document.getElementById('fileInput').click();
                document.getElementById('fileInput').onchange = Storage.loadJson;
                document.getElementById('undoBtn').onclick = () => History.undo();
                document.getElementById('redoBtn').onclick = () => History.redo();
                document.getElementById('playBtn').onclick = () => { if (State.isPlaying) Audio.stop(false); else Audio.play(State.playbackPosition); };
                document.getElementById('stopBtn').onclick = () => { Audio.stop(true); };
            }
        };

        const Storage = {
            exportMML() {
                const mml = Audio.generateMML(0);
                Utils.download(mml, 'song.flmml', 'text/plain');
            },
            saveJson() {
                const data = { tracks: State.tracks, bpm: document.getElementById('tempoInput').value, version: 2 };
                Utils.download(JSON.stringify(data), 'song.json', 'application/json');
            },
            loadJson(e) {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        let data = JSON.parse(evt.target.result);
                        if (!data.version) {
                            if (data.tempo) {
                                document.getElementById('tempoInput').value = data.tempo;
                                document.getElementById('valBPM').textContent = data.tempo;
                            }
                            if (data.volume) {
                                document.getElementById('masterVolume').value = data.volume;
                                document.getElementById('valMaster').textContent = Math.round(data.volume * 100) + '%';
                                Audio.setMasterVolume(parseFloat(data.volume));
                            }
                            data.tracks = data.tracks.map(t => {
                                const newSettings = {
                                    waveform: t.settings.waveform ?? 3,
                                    attack: t.settings.attack ?? 0,
                                    decay: t.settings.decay ?? 60,
                                    sustain: t.settings.sustain ?? 30,
                                    release: t.settings.release ?? 1,
                                    detune: t.settings.detune ?? 0,
                                    volume: t.settings.trackVolume ?? t.settings.volume ?? 100
                                };
                                const newNotes = t.notes.map(n => {
                                    const oldXGrid = n.x / 16;
                                    const oldPitchIdx = 11 - (n.y / 16);
                                    const octave = n.octave;
                                    const octIndex = octave - Config.BASE_OCTAVE;
                                    const octaveRows = ((Config.OCTAVES - 1) - octIndex) * 12;
                                    const pitchRows = 11 - oldPitchIdx;
                                    const newY = (octaveRows + pitchRows) * Config.GRID_H;
                                    return {
                                        x: oldXGrid * 2, 
                                        y: newY,
                                        length: (n.length ?? 1) * 2, 
                                        octave: octave
                                    };
                                }).filter(n => n.x < Config.TOTAL_COLS);
                                return { settings: newSettings, notes: newNotes };
                            });
                        }

                        if (data.tracks) {
                            State.tracks = data.tracks;
                            if (data.bpm) {
                                document.getElementById('tempoInput').value = data.bpm;
                                document.getElementById('valBPM').textContent = data.bpm;
                            }
                            State.currentTrackIndex = 0; State.selectedNote = null; History.init(); View.refresh();
                        }
                    } catch(err) { 
                        console.error(err);
                        alert("読み込みエラー: " + err.message); 
                    }
                };
                reader.readAsText(file); e.target.value = ''; 
            }
        };

        const Utils = {
            download(content, filename, type) {
                const blob = new Blob([content], { type });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
            },
            removeOverlaps(targetNote) {
                const track = State.getCurrentTrack();
                track.notes = track.notes.filter(n => {
                    if (n === targetNote) return true;
                    const targetEnd = targetNote.x + targetNote.length;
                    const nEnd = n.x + n.length;
                    if (nEnd <= targetNote.x || n.x >= targetEnd) return true;
                    if (n.x >= targetNote.x && nEnd <= targetEnd) return false;
                    if (n.x < targetNote.x) { n.length = targetNote.x - n.x; return true; }
                    return false;
                });
            }
        };

        window.onload = () => { State.init(); History.init(); Audio.init(); View.init(); Input.init(); };
    </script>
</body>
